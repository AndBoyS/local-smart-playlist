fields:
  basic_info:
    - name: name
      description: Model name and variants
      detail_level: brief
    - name: org
      description: Lab/company/university, authors
      detail_level: brief
    - name: release_date
      description: Paper date, checkpoint release date
      detail_level: brief
    - name: links
      description: Paper URL, code repo, HuggingFace hub ids
      detail_level: brief

  architecture:
    - name: backbone
      description: Core encoder architecture (ViT/RVQ/Whisper-style/Mamba/LLM etc.)
      detail_level: moderate
    - name: input_modality
      description: audio / MIDI / score / text / multilingual text
      detail_level: moderate
    - name: training_objective
      description: Contrastive / masked modeling / BYOL-style / captioning / SFT+RL mix
      detail_level: detailed
    - name: embedding_output
      description: embedding_dim (MuQ-MuLan 512, CLaMP 3 768), global vs frame-level, aggregation
      detail_level: moderate
      uncertain: false

  data:
    - name: training_data
      description: Dataset scale, sources, license of data
      detail_level: moderate

  performance:
    - name: benchmarks
      description: MuChoMusic, MusicBench, Song Describer, MGM captivating, GTZAN zero-shot, SongCaps — specify which suite applies, embedding-family vs LLM-family
      detail_level: detailed
    - name: vs_clap
      description: Direct deltas vs LAION-CLAP / MuLan on same benchmarks
      detail_level: moderate

  availability:
    - name: license
      description: CC-BY-NC vs research-only vs Apache-2.0; production use gating
      detail_level: moderate

  fit_for_local_playlist:
    - name: sample_rate
      description: MuQ=24k, Cacophony/GLAP=16k vs repo standard 48k mono
      detail_level: brief
    - name: inference_cost
      description: Params, CPU vs GPU needed, per-track latency, memory
      detail_level: moderate
    - name: full_track_context
      description: 10s clip vs multi-min windowed/long-context support for whole-track indexing
      detail_level: moderate
    - name: frame_level_support
      description: Temporal/frame embeddings for section-level playlist logic (FIGMA/FineLAP style)
      detail_level: moderate
    - name: multilingual_queries
      description: Query language coverage (CLaMP 3, GLAP, MuQ-MuLan)
      detail_level: brief
    - name: retrieval_steering
      description: Attribute control/steerability (TP-CLAP, sparse steerable retrieval)
      detail_level: moderate

uncertain:
  - CLaMP 3 audio encoder actual choice per checkpoint
  - SLAP v2 checkpoint availability
  - MuQ-MuLan CPU inference latency
  - AF-Next state of/actual license terms (parsed as research-only by step-2 agent, no explicit statement)
  - MuChoMusic leaderboard numbers current as of 2026-09 (designated as fast-moving)
  - FIGMA FineLAP fine-grained alignment requirements actually usable at inference or FC-only
