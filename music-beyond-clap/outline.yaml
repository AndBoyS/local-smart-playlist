topic: Models beyond CLAP for music understanding
status: outline-complete
current_date: 2026-09-17

items:
  # Verified (corrected)
  - name: MuQ / MuQ-MuLan
    summary: Tencent AI Lab, arXiv 2501.01108. Mel-RVQ SSL; MuLan-style text contrastive, 512-d, zero-shot tagging SOTA at release. HF OpenMuQ/MuQ-MuLan-large, 24 kHz input, CC-BY-NC.
  - name: MERT
    summary: Aging SSL baseline; still used as audio feature extractor in CLaMP 3. Superseded on MARBLE by MuQ/MusicFM.
  - name: MusicFM
    summary: Won et al., ICASSP 2024. Valid MARBLE baseline (avg 75.4). repo minzwon/musicfm.
  - name: MuChoMusic / MusicBench
    summary: Benchmarks, not models. MuChoMusic (ISMIR 2024), MusicBench (from GaMMA). For comparing embedding models.

  # Supplementary embedding/contrastive models (2025-2026)
  - name: SLAP / SLAP v2
    summary: Siamese (BYOL-style, no negatives) language-audio pretraining. Beats CLAP on text-music retrieval; v2 = 109M pairs, variable duration. arXiv 2506.17815, ICASSP 2026.
  - name: M2D-CLAP
    summary: NTT CS Lab, IEEE Access 2025. Masked modeling + CLAP joint. GTZAN zero-shot 75.17. HF available.
  - name: Cacophony
    summary: U. Rochester, TASLP. MAE + contrastive + captioning, 13k hours. SOTA audio-text retrieval at release. Open checkpoints.
  - name: GLAP
    summary: Xiaomi, ICASSP 2026, arXiv 2506.11350. Contrastive across speech/music/sound, 8+ languages. Apache 2.0, HF mispeech/GLAP. Music retrieval matches music-specific CLAPs.
  - name: FIGMA
    summary: ACL 2026. Fine-grained music retrieval, global + frame-level alignment on frozen MuQ + E5; FGMCaps 380K pairs w/ tempo/key/chords. Up to +73.3% rel. over CLAP models.
  - name: FineLAP
    summary: ACL 2026. Clip+frame-level joint alignment, heterogeneous supervision; open-vocab SED + retrieval.
  - name: AllMusicCaps + improved CLAP
    summary: MTG-UPF, Aug 2026, arXiv 2608.25244. Album-review captions + SigReg isotropic regularization. Beats open CLAP baselines on Song Describer.
  - name: TP-CLAP
    summary: Sep 2026, arXiv 2607.25085. Text-prompted attribute-focused audio-to-audio retrieval built on CLAP.

  # SSL / new paradigm
  - name: PupuJEPA
    summary: arXiv 2606.25713. Frequency-aware JEPA-style music SSL; competitive with MuQ/MusicFM on MARBLE without masking prediction.
  - name: Collap / T-CLAP / ReCLAP
    summary: Long-form contrastive w/ temporal structure augmentation (Collap, ICASSP 2025); caption-enhanced/fine-grained CLAP variants (T-CLAP, ReCLAP ICASSP 2025).

  # Music/audio LLMs — filtered out (7B+, not embedding-retrieval, not local-numpy fit)
  # Symbolic models (CLaMP 3, MusicBERT) — filtered out (project indexes audio files, no MIDI/score)

  # Retrieval control / steering
  - name: GD-Retriever
    summary: ISMIR 2025. Diffusion-generated latent queries for text-music retrieval over CLAP/MULE/MusCALL spaces. Interactive query refinement for playlists.
  - name: Sparse Steerable Retrieval
    summary: ISMIR 2026. SAE on MuQ-MuLan embeddings; open-vocab concept sliders for playlist steering. Directly relevant. Code public.

execution:
  batch_size: 2
  items_per_agent: 4
  output_dir: ./music-beyond-clap/results
